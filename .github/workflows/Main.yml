name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate missing platform folders
        run: flutter create --platforms=android --project-name=coachfit --org com.coachfit .

      - name: Patch Kotlin version
        run: |
          sed -i 's/org.jetbrains.kotlin.android" version "[0-9.]*"/org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle

      # Fix: repo.maven.apache.org sometimes returns 403 Forbidden to
      # GitHub Actions' shared IP ranges (a known, usually transient,
      # rate-limiting issue on Apache's end, not something wrong with
      # our project). This inserts Google's Maven Central mirror as an
      # extra source Gradle can pull from if Apache's repo is blocking.
      - name: Add Maven Central mirror as fallback
        run: |
          sed -i "s#mavenCentral()#maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }\n        mavenCentral()#g" android/settings.gradle

      - name: Install dependencies
        run: flutter pub get

      # Retries the build up to 3 times in case of another transient
      # network failure, instead of failing the whole workflow on the
      # first hiccup.
      - name: Build APK
        run: |
          for i in 1 2 3; do
            flutter build apk --debug && break
            echo "Build attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coachfit-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
