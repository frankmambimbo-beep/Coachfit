name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Root cause of the aapt2 "failed to load include path .../android-35/android.jar"
      # failures: the runner's preinstalled SDK doesn't have the android-35 platform,
      # or a partial/corrupted download of it. Install it explicitly and fail fast
      # here instead of burning 3 build retries on a resource-linking error.
      - name: Install Android SDK platform 35
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager at $SDKMANAGER"
          # sudo matters here: /usr/local/lib/android/sdk on the hosted runner is
          # root-owned, so an unprivileged sdkmanager install can silently no-op
          # or write a truncated file that still passes a plain -f existence check.
          yes | sudo "$SDKMANAGER" --licenses > /dev/null || true
          sudo "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          sudo chmod -R a+rX "$ANDROID_HOME/platforms/android-35" "$ANDROID_HOME/build-tools/35.0.0" 2>/dev/null || true
          JAR_PATH="$ANDROID_HOME/platforms/android-35/android.jar"
          ls -la "$ANDROID_HOME/platforms/android-35/" || true
          JAR_SIZE=$(stat -c%s "$JAR_PATH" 2>/dev/null || echo 0)
          echo "android.jar size: $JAR_SIZE bytes"
          if [ "$JAR_SIZE" -lt 1000000 ]; then
            echo "android-35 platform jar missing or truncated after install (only $JAR_SIZE bytes), aborting early."
            exit 1
          fi

      - name: Generate missing platform folders
        run: flutter create --platforms=android --project-name=coachfit --org com.coachfit .

      # Bumped from 1.9.22 - the previous pin still left dependencies compiled with
      # newer Kotlin metadata than the plugin expected. 1.9.24 is the latest 1.9.x
      # and stays compatible with Flutter 3.24's bundled AGP.
      - name: Patch Kotlin version
        run: |
          sed -i 's/org.jetbrains.kotlin.android" version "[0-9.]*"/org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle

      - name: Add Maven Central mirror as fallback
        run: |
          sed -i "s#mavenCentral()#maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }\n        mavenCentral()#g" android/settings.gradle

      - name: Add camera permission to manifest
        run: |
          sed -i '/<manifest xmlns:android=/a\    <uses-permission android:name="android.permission.CAMERA"/>' android/app/src/main/AndroidManifest.xml

      - name: Add notification permission to manifest
        run: |
          sed -i '/<manifest xmlns:android=/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      # Reverted --split-per-abi: it triggers a known aapt2 resource-
      # linking bug ("entry offsets overlap actual entry data") from a
      # race condition when building multiple architecture APKs at
      # once. Plain --release alone still gives the large majority of
      # the size reduction (stripped debug symbols) without this risk.
      - name: Build APK
        run: |
          success=false
          for i in 1 2 3; do
            if flutter build apk --release; then
              success=true
              break
            fi
            echo "Build attempt $i failed, retrying in 15s..."
            sleep 15
          done
          if [ "$success" = false ]; then
            echo "All build attempts failed."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coachfit-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
