name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate missing platform folders
        run: flutter create --platforms=android --project-name=coachfit --org com.coachfit .

      - name: Patch Kotlin version
        run: |
          sed -i 's/org.jetbrains.kotlin.android" version "[0-9.]*"/org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle

      - name: Add Maven Central mirror as fallback
        run: |
          sed -i "s#mavenCentral()#maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }\n        mavenCentral()#g" android/settings.gradle

      # Fix: the camera plugin needs Java 8+ core library desugaring
      # enabled, or Gradle fails while dexing its newer AAR files.
      # This is Google's own documented fix for this exact issue.
      - name: Enable core library desugaring for camera plugin
        run: |
          sed -i '/targetCompatibility = JavaVersion.VERSION_1_8/a\        coreLibraryDesugaringEnabled true' android/app/build.gradle
          sed -i "s/dependencies {}/dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}/" android/app/build.gradle

      # Camera access requires this permission declared in the manifest,
      # or the app crashes the moment it tries to open the camera.
      - name: Add camera permission to manifest
        run: |
          sed -i '/<manifest xmlns:android=/a\    <uses-permission android:name="android.permission.CAMERA"/>' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          for i in 1 2 3; do
            flutter build apk --debug && break
            echo "Build attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coachfit-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
