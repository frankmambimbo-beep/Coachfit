name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate missing platform folders
        run: flutter create --platforms=android --project-name=coachfit --org com.coachfit .

      - name: Patch Kotlin version
        run: |
          sed -i 's/org.jetbrains.kotlin.android" version "[0-9.]*"/org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle

      - name: Add Maven Central mirror as fallback
        run: |
          sed -i "s#mavenCentral()#maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }\n        mavenCentral()#g" android/settings.gradle

      - name: Add camera permission to manifest
        run: |
          sed -i '/<manifest xmlns:android=/a\    <uses-permission android:name="android.permission.CAMERA"/>' android/app/src/main/AndroidManifest.xml

      - name: Add notification permission to manifest
        run: |
          sed -i '/<manifest xmlns:android=/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      # Switched from --debug to --release (strips debug symbols, much
      # smaller) and split per CPU architecture, so each downloaded
      # file only contains what your specific phone needs instead of
      # bundling support for every architecture into one large file.
      - name: Build APK
        run: |
          success=false
          for i in 1 2 3; do
            if flutter build apk --release --split-per-abi; then
              success=true
              break
            fi
            echo "Build attempt $i failed, retrying in 15s..."
            sleep 15
          done
          if [ "$success" = false ]; then
            echo "All build attempts failed."
            exit 1
          fi

      # Uploads all 3 architecture-specific APKs as one artifact zip.
      # arm64-v8a covers the vast majority of Android phones made since
      # ~2017 — that's almost certainly the one to install.
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: coachfit-apk-release
          path: build/app/outputs/flutter-apk/*.apk
