name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate missing platform folders
        run: flutter create --platforms=android --project-name=coachfit --org com.coachfit .

      - name: Patch Kotlin version
        run: |
          sed -i 's/org.jetbrains.kotlin.android" version "[0-9.]*"/org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle

      - name: Add Maven Central mirror as fallback
        run: |
          sed -i "s#mavenCentral()#maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }\n        mavenCentral()#g" android/settings.gradle

      # Fixed: desugar_jdk_libs 2.1.4 uses a newer spec format ("200")
      # than the D8 compiler bundled with this older Flutter/AGP
      # toolchain understands ("100"), causing a JSON parsing crash.
      # 1.2.2 uses the older, compatible spec format.
      - name: Enable core library desugaring for camera plugin
        run: |
          sed -i '/compileOptions {/a\        coreLibraryDesugaringEnabled true' android/app/build.gradle
          echo "" >> android/app/build.gradle
          echo "dependencies {" >> android/app/build.gradle
          echo "    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:1.2.2\"" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      - name: Add camera permission to manifest
        run: |
          sed -i '/<manifest xmlns:android=/a\    <uses-permission android:name="android.permission.CAMERA"/>' android/app/src/main/AndroidManifest.xml

      - name: Show patched build.gradle
        run: cat android/app/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          success=false
          for i in 1 2 3; do
            if flutter build apk --debug; then
              success=true
              break
            fi
            echo "Build attempt $i failed, retrying in 15s..."
            sleep 15
          done
          if [ "$success" = false ]; then
            echo "All build attempts failed."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coachfit-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
