name: coachfit
description: "CoachFit — an offline-first personal fitness coach with habit tracking, XP progression, and on-device camera-based rep counting."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0

  fl_chart: ^0.68.0

  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  camera: 0.10.6

  # Phase 5, Stage B — isolation test. Added alone, with no pose-
  # detection code wired up yet, so if the build breaks we know
  # immediately it's this package and not something we wrote.
  google_mlkit_pose_detection: ^0.13.0

  uuid: ^4.4.0
  intl: ^0.19.0
  equatable: ^2.0.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
