name: coachfit
description: "CoachFit — an offline-first personal fitness coach with habit tracking, XP progression, and on-device camera-based rep counting."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0

  fl_chart: ^0.68.0

  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Pinned to 0.10.6 — versions 0.11.0+ switched the default Android
  # implementation to camera_android_camerax, which pulls in
  # androidx.camera 1.4.1 and fails to dex on this older toolchain
  # (a known, currently open Flutter bug: flutter/flutter#160815).
  # 0.10.6 uses the older camera_android implementation instead, which
  # talks to Android's Camera2 API directly with no CameraX involved.
  camera: 0.10.6

  uuid: ^4.4.0
  intl: ^0.19.0
  equatable: ^2.0.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
